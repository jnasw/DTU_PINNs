wandb:
  api_key: "f59f1641c244c4b01676975c59bf902da71a5e9c"
  project: "Project_PINN_for_synchronous_machine"

time : 1 # Total time
num_of_points : 1000 # Number of points
save_freq : 1000 # Save batches of nth trajectories
PINN_flag : False # True if PINN is to be used

model:
  model_flag : "SM4_P" #  Choose between "SM_IB" or "SM4" or "SM_AVR" or "SM_AVR_GOV" or "SM4_P"
