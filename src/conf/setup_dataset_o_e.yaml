  init_condition_bounds : 1
  sampling: "Lhs" # Choose between "Lhs" or "Linear" or "Random"
  torch : False

dirs:
  params_dir :  ${hydra:runtime.cwd}/src/conf/params
  init_conditions_dir : ${hydra:runtime.cwd}/src/conf/initial_conditions_o_e
  dataset_dir : ${hydra:runtime.cwd}/data_o_e